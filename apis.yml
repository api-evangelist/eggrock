name: Eggrock
description: 'Eggrock (Eggrock Modular Solutions; legally Innovative Modular Pre-Fabrication
  LLC) is a North American manufacturer of prefabricated "bathroom-in-a-box" pods
  — complete, custom, ready-to-install bathrooms built off-site using BIM-driven design
  and lean manufacturing for hotels, hospitals, dormitories, military barracks, and
  other multi-unit construction projects. Off-site fabrication compresses construction
  schedules and improves quality versus building bathrooms on site. In 2012 Eggrock
  licensed exclusive North American manufacturing and distribution to Oldcastle Precast.
  It is a construction / building-products manufacturer with no public API, developer
  portal, SDK, or machine-readable developer surface.'
